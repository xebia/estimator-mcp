name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore estimator-mcp.slnx

      # SourceRevisionId lands in InformationalVersion as "+<sha>", so any build
      # artifact traces back to the exact commit. See VERSIONING.md.
      - name: Build
        run: >
          dotnet build estimator-mcp.slnx -c Release --no-restore
          -p:SourceRevisionId=${{ github.sha }}

      - name: Test
        run: >
          dotnet test estimator-mcp.slnx -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ./TestResults/*.trx
          if-no-files-found: warn

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore estimator-mcp.slnx

      # `dotnet list package --vulnerable` exits 0 even when it finds advisories,
      # so detect them in the output rather than trusting the exit code.
      - name: Fail on known vulnerabilities
        run: |
          dotnet list estimator-mcp.slnx package --vulnerable --include-transitive | tee audit.log
          if grep -q 'has the following vulnerable packages' audit.log; then
            echo "::error::Vulnerable NuGet packages detected - see the log above"
            exit 1
          fi
          echo "No known vulnerable packages."
