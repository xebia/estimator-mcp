version: 2

updates:
  # NuGet. The NuGet ecosystem scans the given directory recursively, so "/"
  # covers every project under src/ and tests/.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
    # Grouped by family so a servicing month lands as a handful of reviewable
    # PRs rather than one per package. Anything not matched here still gets its
    # own PR.
    groups:
      dotnet:
        patterns:
          - "Microsoft.Extensions.*"
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore.*"
      identity:
        patterns:
          - "Microsoft.Identity.*"
      serilog:
        patterns:
          - "Serilog*"
      opentelemetry:
        patterns:
          - "OpenTelemetry*"
      test:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
    ignore:
      # The MCP SDK jump (0.5.0-preview.1 and 1.1.0 -> 2.x) spans two major
      # versions with breaking API changes, and is tracked as its own piece of
      # work. Minor and patch updates still flow. Delete this block when that
      # migration happens.
      - dependency-name: "ModelContextProtocol*"
        update-types: ["version-update:semver-major"]

  # Keep the CI workflow's actions current. The first CI run already caught
  # actions pinned to a deprecated Node runtime; this stops that recurring.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"
